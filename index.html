<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMGSheet</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main id="app">
      <section class="empty" id="empty">
        <h1>Convert images to PDF</h1>
        <p>Drop photos here</p>
        <span class="or">or</span>
        <button type="button" id="choose">Choose Photos</button>
      </section>

      <section id="photos" hidden>
        <header>
          <span id="count"></span>
          <button type="button" id="add-more">Add photos</button>
        </header>
        <ul id="errors"></ul>
        <div id="grid"></div>
      </section>
    </main>
  </body>
</html>
